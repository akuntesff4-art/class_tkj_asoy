<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — CLASS QUESTERS TKJ A</title>
<link rel="stylesheet" href="css/style.css">
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="loaded">

<header>
  <div class="wrap navbar">
    <div class="brand">
      <img class="logo" src="assets/logo.jpg" alt="Logo Kelas">
      <div class="brand-text">
        <h1>CLASS QUESTERS TKJ A</h1>
        <p>ADMIN PANEL</p>
      </div>
    </div>
    <nav class="navlinks"><a href="index.html" class="navlink" data-sound="click">← Kembali ke Situs</a></nav>
  </div>
</header>

<div class="wrap admin-shell">

  <div id="loginBox" class="admin-login">
    <div class="eyebrow" style="justify-content:center">🔒 ADMIN LOGIN</div>
    <h2 style="font-size:22px">Masuk dulu, ya</h2>
    <input type="password" id="loginPassword" placeholder="Password admin" autocomplete="current-password">
    <button id="loginBtn" class="btn btn-primary ripple-btn" style="width:100%;justify-content:center">Login</button>
    <div class="admin-msg" id="loginMsg"></div>
  </div>

  <div id="adminBox" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div class="eyebrow" style="margin-bottom:0">✅ LOGGED IN AS ADMIN</div>
      <button id="logoutBtn" class="btn btn-outline ripple-btn" data-sound="close">Logout</button>
    </div>
    <div id="persistenceBadge" class="admin-msg" style="margin-bottom:18px"></div>
    <div class="admin-block">
      <h3>🗂️ Struktur Kelas</h3>
      <div id="structureForm"></div>
      <button id="saveStructure" class="btn btn-outline ripple-btn" style="margin-top:10px">Simpan Struktur</button>
      <div class="admin-msg" id="structureMsg"></div>
    </div>

    <div class="admin-block">
      <h3>🧹 Jadwal Piket</h3>
      <div id="piketForm"></div>
      <button id="savePiket" class="btn btn-outline ripple-btn" style="margin-top:10px">Simpan Piket</button>
      <div class="admin-msg" id="piketMsg"></div>
    </div>

    <div class="admin-block">
      <h3>🔗 Social Media</h3>
      <div id="socialForm"></div>
      <button id="saveSocial" class="btn btn-outline ripple-btn" style="margin-top:10px">Simpan Social</button>
      <div class="admin-msg" id="socialMsg"></div>
    </div>

    <div class="admin-block">
      <h3>📢 Pengumuman</h3>
      <div class="admin-row">
        <input type="text" id="announceInput" placeholder="Tulis pengumuman baru...">
        <button id="addAnnounce" class="btn btn-primary ripple-btn">Tambah</button>
      </div>
      <div id="announceList" style="margin-top:12px"></div>
    </div>
  </div>

</div>

<script src="js/sound.js"></script>
<script src="js/animations.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
